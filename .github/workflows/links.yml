name: Benefit links
# Checks that every official link in the UK and Canada benefits modules still opens.
on:
  schedule:
    - cron: "7 13 1 * *"   # 1st of each month
  workflow_dispatch:
  push:
    paths: ["js/benefits/**", "tools/check-links.mjs", ".github/workflows/links.yml"]
permissions:
  contents: read
jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node tools/check-links.mjs js/benefits/gb.js js/benefits/ca.js
