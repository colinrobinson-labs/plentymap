name: Research snapshot
# One-off: saves the USDA SNAP state directory pages so the state table can be checked by hand.
on:
  push:
    branches: [launch]
    paths: [".github/workflows/research.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  snap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Fetch the USDA state directory pages
        run: |
          mkdir -p out && cd out
          for s in Alabama Alaska Arizona Arkansas California Colorado Connecticut Delaware "District of Columbia" Florida Georgia Guam Hawaii Idaho Illinois Indiana Iowa Kansas Kentucky Louisiana Maine Maryland Massachusetts Michigan Minnesota Mississippi Missouri Montana Nebraska Nevada "New Hampshire" "New Jersey" "New Mexico" "New York" "North Carolina" "North Dakota" Ohio Oklahoma Oregon Pennsylvania "Rhode Island" "South Carolina" "South Dakota" Tennessee Texas Utah Vermont "Virgin Islands" Virginia Washington "West Virginia" Wisconsin Wyoming; do
            u="https://www.fna.usda.gov/snap/snap-directory-entry/${s// /%20}"
            curl -fsSL -A "PlentyMapResearch/1.0" "$u" -o "${s// /_}.html" || echo "failed $s"
            sleep 1
          done
          curl -fsSL -A "PlentyMapResearch/1.0" "https://www.fna.usda.gov/snap/broad-based-categorical-eligibility" -o bbce.html || true
          ls -la | head -70
      - name: Save to the research branch
        run: |
          cd out
          git init -q && git checkout -q -b research
          git config user.name "plentymap-bot" && git config user.email "bot@plentymap.com"
          git add -A && git commit -qm "USDA SNAP state directory snapshot $(date -u +%F)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" research
