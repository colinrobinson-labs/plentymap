name: Research snapshot
# One-off: checks every outside link the Help tab will use (final address and status).
on:
  push:
    branches: [launch]
    paths: [".github/workflows/research.yml", "tools/.links-check.txt"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check links
        run: |
          mkdir -p out
          while read -r u; do
            [ -n "$u" ] || continue
            r=$(curl -sS -L -o /tmp/body -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/130 Safari/537.36" --max-time 40 -w '%{http_code} %{url_effective}' "$u" 2>&1 | tail -1)
            title=$(grep -o -i '<title[^>]*>[^<]*' /tmp/body 2>/dev/null | head -1 | sed 's/<title[^>]*>//' | tr -s ' \n\t' ' ' | cut -c1-90)
            printf '%s\t%s\t%s\n' "$u" "$r" "$title" >> out/links.tsv
          done < tools/.links-check.txt
          cut -f2 out/links.tsv | cut -c1-3 | sort | uniq -c
      - name: Save to the research branch
        run: |
          cd out
          git init -q && git checkout -q -b research
          git config user.name "plentymap-bot" && git config user.email "bot@plentymap.com"
          git add -A && git commit -qm "Link check $(date -u +%F)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" research
