name: Pantry source research
# Research only, on the pantry-sources work branch: checks candidate pantry sources and the
# state-by-state OpenStreetMap pull, and saves what it finds to the pantry-research branch.
# Never touches the usdata branch or the live site.
on:
  push:
    branches: [claude/project-thread-p8w00o]
    paths:
      - "tools/research/**"
      - "tools/fetch-us.mjs"
      - "tools/fetch-pantries.mjs"
      - "tools/pantry-sources.mjs"
      - "tools/build-pantries.mjs"
      - ".github/workflows/pantry-probe.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pantry-probe
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Candidate sources and food bank platforms
        continue-on-error: true
        timeout-minutes: 45
        run: |
          if [ -f tools/research/run.sh ]; then bash tools/research/run.sh /tmp/r/probe; else node tools/research/probe.mjs /tmp/r/probe; fi
      - name: Save the probe results early
        if: always()
        run: |
          cd /tmp/r
          find . -size +40M -delete
          rm -rf .git && git init -q -b pantry-research
          git config user.name "plenty-map-research"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Pantry source research $(date -u +%FT%H%M)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" pantry-research
      - name: OpenStreetMap, region by region
        continue-on-error: true
        timeout-minutes: 45
        run: |
          mkdir -p /tmp/r/osm
          ONLY=place,osm node tools/fetch-us.mjs /tmp/r/osm
          cp /tmp/r/osm/place.tsv /tmp/r/probe/place.tsv || true
          rm -f /tmp/r/osm/place.tsv /tmp/r/osm/osm-regions.json
      - name: Food bank lists to map listings (with the Census geocoder)
        continue-on-error: true
        timeout-minutes: 15
        run: |
          node tools/build-pantries.mjs /tmp/r/probe
          rm -f /tmp/r/probe/place.tsv
      - name: Save to the pantry-research branch
        if: always()
        run: |
          cd /tmp/r
          find . -size +40M -delete
          rm -rf .git && git init -q -b pantry-research
          git config user.name "plenty-map-research"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Pantry source research $(date -u +%FT%H%M)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" pantry-research
