name: Intl probe
# One-off: samples the UK and Canada sources and sizes the map tiles. Prints to the log only
# (read-only, pushes nothing). Round 2. Removed before merge.
on:
  push:
    branches: [claude/project-thread-xoxzmq]
    paths: [".github/workflows/intl-probe.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Fetch samples (round 2)
        run: |
          mkdir -p /tmp/p && cd /tmp/p
          UA="PlentyMapDataBot/1.0 (free food-help app; https://plentymap.com)"
          curl -sSL -A "$UA" -o bc.json -w 'bc %{http_code} %{size_download}\n' "https://openmaps.gov.bc.ca/geo/pub/wfs?service=WFS&version=2.0.0&request=GetFeature&typeName=pub:WHSE_IMAGERY_AND_BASE_MAPS.GSR_FOOD_BANKS_SV&outputFormat=application/json&srsName=EPSG:4326"
          curl -sSL -A "$UA" -o gf-locations.json https://www.givefood.org.uk/api/2/locations/
          curl -sSL -A "$UA" -o gf-foodbanks.json https://www.givefood.org.uk/api/2/foodbanks/
          for c in CA GB; do
            q="[out:json][timeout:600];area[\"ISO3166-1\"=\"$c\"][admin_level=2]->.a;(nwr[\"amenity\"~\"^(food_bank|community_fridge|food_sharing|soup_kitchen)\$\"](area.a);nwr[\"amenity\"=\"social_facility\"][\"social_facility\"~\"^(food_bank|soup_kitchen)\$\"](area.a););out center meta;"
            curl -sS -A "$UA" -m 900 -o "osm-$c.json" -w "osm $c %{http_code} %{size_download}\n" --data-urlencode "data=$q" https://overpass-api.de/api/interpreter || echo "osm $c failed"
            sleep 15
            q2="[out:json][timeout:600];area[\"ISO3166-1\"=\"$c\"][admin_level=2]->.a;(nwr[\"shop\"=\"supermarket\"][\"brand\"](area.a););out center tags;"
            curl -sS -A "$UA" -m 900 -o "osm-shops-$c.json" -w "shops $c %{http_code} %{size_download}\n" --data-urlencode "data=$q2" https://overpass-api.de/api/interpreter || echo "shops $c failed"
            sleep 15
          done
          head -c 300 osm-CA.json
      - name: Print samples
        run: |
          cd /tmp/p
          echo "== bc count $(jq '.features|length' bc.json)"; jq '.features[0:2]' bc.json
          jq -r '.features[].properties | keys | join(",")' bc.json | sort | uniq -c | head
          echo "== gf locations keys"; jq -r '.[0] | keys | join(",")' gf-locations.json; jq -r '[.[].foodbank.network] | group_by(.) | map("\(length) \(.[0])") | .[]' gf-locations.json
          echo "== gf foodbanks by country/network"; jq -r '[.[] | "\(.country) \(.network) closed=\(.closed)"] | group_by(.) | map("\(length) \(.[0])") | .[]' gf-foodbanks.json
          echo "gf foodbanks with locations in list: $(jq '[.[].foodbank.slug] | unique | length' gf-locations.json)"
          for f in osm-CA.json osm-GB.json osm-shops-CA.json osm-shops-GB.json; do echo "== $f $(jq '.elements|length' $f)"; done
          for c in CA GB; do jq -r '[.elements[].tags | (.amenity // "") + "/" + (.social_facility // "")] | group_by(.) | map("\(length) \(.[0])") | .[]' osm-$c.json; done
          jq '.elements[0:2]' osm-CA.json
          jq -r '[.elements[] | select(.tags.amenity=="food_bank") | .tags | keys[]] | group_by(.) | map("\(length) \(.[0])") | .[]' osm-CA.json | sort -rn | head -40
          for c in CA GB; do echo "== brands $c"; jq -r '[.elements[].tags.brand // empty] | group_by(.) | map([length, .[0]]) | sort | reverse | .[:45][] | "\(.[0]) \(.[1])"' osm-shops-$c.json; done
