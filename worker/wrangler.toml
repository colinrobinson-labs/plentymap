# Plenty Map report endpoint: report.plentymap.com
# Free plan only (Workers Free + D1 Free). No logs, no tail, no analytics of request details.
name = "plentymap-report"
main = "src/index.js"
compatibility_date = "2026-11-01"
workers_dev = false
routes = [{ pattern = "report.plentymap.com", custom_domain = true }]

[observability]
enabled = false

[[d1_databases]]
binding = "DB"
database_name = "plentymap-reports"
database_id = "219d466b-f8d3-427b-8786-86bf08471199"

[triggers]
crons = ["17 9 * * *"]   # daily retention clean-up, 09:17 UTC
